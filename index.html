<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>능률VOCA [2025] 단어장 모음</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .list {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item:hover {
      background: #f9fafb;
    }

    .left {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .day {
      font-weight: 700;
      font-size: 1rem;
    }

    .title {
      color: var(--muted);
      font-size: 0.92rem;
      word-break: break-all;
    }

    .go {
      flex-shrink: 0;
      background: var(--accent);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .item:hover .go {
      background: var(--accent-hover);
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="header">
      <h1 id="bookTitle">능률VOCA 중등 기본 [2025]</h1>
      <p class="desc" id="bookDesc">DAY 01부터 DAY 50까지 바로 열 수 있는 링크 모음입니다.</p>
    </section>

    <nav class="tabs" id="tabMenu"></nav>

    <section class="list" id="dayList"></section>

    <footer>
      원하는 단어장을 선택한 뒤 DAY 버튼을 눌러 클래스카드로 이동하세요.
    </footer>
  </div>

  <script>
    // 단어장 설정 목록 (클래스카드 각 단어장의 DAY 01 setId 및 총 DAY 수 입력)
    const books = [
      {
        id: 'middle-basic',
        tabName: '중등 기본',
        title: '능률VOCA 중등 기본 [2025]',
        baseId: 25380956,
        totalDays: 50
      },
      {
        id: 'middle-high',
        tabName: '중등 고난도',
        title: '능률VOCA 중등 고난도 [2025]',
        baseId: 25381006, // 실제 DAY 01 세트 번호로 변경 필요
        totalDays: 50
      },
      {
        id: 'high-basic',
        tabName: '고등 기본',
        title: '능률VOCA 고등 기본 [2025]',
        baseId: 25381056, // 실제 DAY 01 세트 번호로 변경 필요
        totalDays: 60
      },
      {
        id: 'high-complete',
        tabName: '고등 완성',
        title: '능률VOCA 고등 완성 [2025]',
        baseId: 25381116, // 실제 DAY 01 세트 번호로 변경 필요
        totalDays: 60
      }
    ];

    const bookTitleEl = document.getElementById('bookTitle');
    const bookDescEl = document.getElementById('bookDesc');
    const tabMenu = document.getElementById('tabMenu');
    const dayList = document.getElementById('dayList');

    let currentBookId = books[0].id;

    function renderTabs() {
      tabMenu.innerHTML = '';
      books.forEach(book => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab-btn ${book.id === currentBookId ? 'active' : ''}`;
        btn.textContent = book.tabName;
        btn.addEventListener('click', () => {
          currentBookId = book.id;
          renderTabs();
          renderList(book);
        });
        tabMenu.appendChild(btn);
      });
    }

    function renderList(book) {
      bookTitleEl.textContent = book.title;
      bookDescEl.textContent = `DAY 01부터 DAY ${String(book.totalDays).padStart(2, '0')}까지 바로 열 수 있는 링크 모음입니다.`;
      
      dayList.innerHTML = '';
      const fragment = document.createDocumentFragment();

      for (let day = 1; day <= book.totalDays; day++) {
        const setId = book.baseId + (day - 1);
        const dayText = String(day).padStart(2, '0');
        const url = `https://www.classcard.net/set/${setId}`;

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'item';

        const left = document.createElement('div');
        left.className = 'left';

        const daySpan = document.createElement('span');
        daySpan.className = 'day';
        daySpan.textContent = `DAY ${dayText}`;

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = `${book.title} DAY ${dayText}`;

        const goSpan = document.createElement('span');
        goSpan.className = 'go';
        goSpan.textContent = '열기';

        left.append(daySpan, titleSpan);
        link.append(left, goSpan);
        fragment.appendChild(link);
      }

      dayList.appendChild(fragment);
    }

    // 초기 렌더링
    renderTabs();
    renderList(books[0]);
  </script>
</body>
</html>
